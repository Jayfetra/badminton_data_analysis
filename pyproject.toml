[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwf-player"
version = "0.1.0"
description = "Look up a badminton player's profile and ranking data from bwfbadminton.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.6",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
notebook = [
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[tool.setuptools.packages.find]
include = ["bwf_player*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real bwfbadminton.com site (excluded by default; run with -m live)",
]
